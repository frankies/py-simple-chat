name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main  # 当推送到 main 分支时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools (uv + pa)
        run: |
          pip install "uv>=0.4.0" pythonanywhere requests

      - name: Build virtualenv with uv
        run: |
          uv sync

      - name: Upload project to PythonAnywhere via pa
        env:
          API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          USER: ${{ vars.PA_USERNAME }}
          PA_USERNAME: ${{ vars.PA_USERNAME }}
          PA_DOMAIN: ${{ vars.PA_DOMAIN }}
          PA_PROJECT_PATH: ${{ vars.PA_PROJECT_PATH }}
        run: |
          python .github/scripts/upload_with_pa.py

      - name: Deployment Status
        if: success()
        run: |
          echo "✅ 部署成功！"
          echo "访问地址: https://${{ vars.PA_DOMAIN }}"
